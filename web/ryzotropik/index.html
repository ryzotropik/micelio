<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ryzotropik — ASCII morph</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
    <script src="sketch.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        margin: 0;
        height: 100%;
        width: 100%;
        background: #12161c;
      }
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        width: 100%;
        background: #12161c;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* p5 attaches the canvas directly under body */
      body > canvas {
        display: block;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body></body>
</html>
