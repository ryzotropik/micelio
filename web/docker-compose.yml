version: '3.8'
services:
  ryzotropik_app:
    build: .
    container_name: ryzotropik_app
    restart: unless-stopped
    volumes:
      - ./ryzotropik:/usr/share/nginx/html:ro
    expose:
      - "80"

  arriscada_app:
    build: .
    container_name: arriscada_app
    restart: unless-stopped
    volumes:
      - ./arriscada:/usr/share/nginx/html:ro
    expose:
      - "80"

networks:
  default:
    name: web_sites_net
