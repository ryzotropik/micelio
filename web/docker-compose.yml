services:
  ryzotropik_app:
    build: .
    container_name: ryzotropik_app
    restart: unless-stopped
    volumes:
      - ./ryzotropik:/usr/share/nginx/html:ro
      # Live nginx.conf edits without rebuild; use `make reload-nginx` or `make up-watch` (Compose v2).
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "80"

  arriscada_app:
    build: .
    container_name: arriscada_app
    restart: unless-stopped
    volumes:
      - ./arriscada:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    container_name: web_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ryzotropik_app
      - arriscada_app

networks:
  default:
    name: web_sites_net
