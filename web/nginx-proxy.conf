user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        off;
    tcp_nopush      off;
    open_file_cache off;
    keepalive_timeout  65;

    upstream ryzotropik_app_upstream {
        server ryzotropik_app:80;
    }

    upstream arriscada_app_upstream {
        server arriscada_app:80;
    }

    server {
        listen 80;
        server_name _;

        location = /ryzotropik {
            return 301 /ryzotropik/;
        }
        location = /arriscada {
            return 301 /arriscada/;
        }

        location = / {
            default_type text/html;
            charset utf-8;
            return 200 '<!doctype html><meta charset="utf-8"><title>micelio web</title><h1>micelio web</h1><ul><li><a href="/ryzotropik/">ryzotropik</a></li><li><a href="/arriscada/">arriscada</a></li></ul>';
        }

        location /ryzotropik/ {
            proxy_pass http://ryzotropik_app_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location /arriscada/ {
            proxy_pass http://arriscada_app_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
    }
}
